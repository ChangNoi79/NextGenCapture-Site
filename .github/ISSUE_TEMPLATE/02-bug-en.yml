name: "🐞 Report a bug (English)"
description: Report a reproducible problem in NextGen Capture.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for your report. Please do not share credentials, personal data, or confidential screenshots.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem briefly and clearly.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Number the steps so that we can reproduce the problem.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: NextGen Capture version
      placeholder: e.g. 1.0.1
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Chrome version and operating system
      placeholder: e.g. Chrome 140 on macOS 15
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I have not included credentials, personal data, or confidential content.
          required: true
