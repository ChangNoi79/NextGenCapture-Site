name: Idee vorschlagen
description: Teile eine Idee, die NextGen Capture verbessern würde.
title: "[Idee]: "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Welches Problem möchtest du lösen?
    validations:
      required: true
  - type: textarea
    id: idee
    attributes:
      label: Deine Idee
      description: Beschreibe das gewünschte Verhalten möglichst konkret.
    validations:
      required: true
  - type: checkboxes
    id: datenschutz
    attributes:
      label: Datenschutz
      options:
        - label: Ich habe keine persönlichen oder vertraulichen Inhalte eingefügt.
          required: true
