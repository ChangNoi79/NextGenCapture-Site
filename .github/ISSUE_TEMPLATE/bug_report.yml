name: Fehler melden
description: Melde einen reproduzierbaren Fehler in NextGen Capture.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Danke für deine Meldung. Bitte keine Zugangsdaten, persönlichen Daten oder vertraulichen Screenshots veröffentlichen.
  - type: textarea
    id: beschreibung
    attributes:
      label: Was ist passiert?
      description: Beschreibe den Fehler kurz und klar.
    validations:
      required: true
  - type: textarea
    id: schritte
    attributes:
      label: Schritte zum Nachstellen
      description: Nummeriere die Schritte, damit wir den Fehler reproduzieren können.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: erwartet
    attributes:
      label: Erwartetes Verhalten
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version von NextGen Capture
      placeholder: z. B. 1.0.1
    validations:
      required: true
  - type: input
    id: chrome
    attributes:
      label: Chrome-Version und Betriebssystem
      placeholder: z. B. Chrome 140 unter macOS 15
    validations:
      required: true
  - type: checkboxes
    id: datenschutz
    attributes:
      label: Datenschutz
      options:
        - label: Ich habe keine Zugangsdaten, personenbezogenen Daten oder vertraulichen Inhalte eingefügt.
          required: true
