name: "✨ Idee vorschlagen (Deutsch)"
description: Eine Idee einreichen, die NextGen Capture verbessern würde.
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Bitte keine Zugangsdaten, personenbezogenen Daten oder vertraulichen Inhalte veröffentlichen.
  - type: textarea
    id: problem
    attributes:
      label: Welches Problem möchtest du lösen?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Deine Idee
      description: Beschreibe das gewünschte Verhalten möglichst konkret.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Datenschutz
      options:
        - label: Ich habe keine persönlichen oder vertraulichen Inhalte eingefügt.
          required: true
